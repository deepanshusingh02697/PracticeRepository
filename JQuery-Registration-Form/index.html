<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.3.3/css/dataTables.dataTables.min.css"
    />
    <link rel="stylesheet" href="./index.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.3/js/dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Registration Form</h1>
      <br />
      <form action="" id="form">
        <label for="name">Enter Name <span>*</span></label>
        <input type="text" id="name" name="name" placeholder="Enter Name" />

        <label for="adhaar">Enter Aadhaar Number <span>*</span></label>
        <input
          type="tel"
          id="adhaar"
          name="adhaar"
          placeholder="Enter 12-digit Aadhaar Number"
          maxlength="12"
          inputmode="numeric"
        />

        <label for="phone">Phone No. <span>*</span></label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter 10-digit phone number"
          maxlength="10"
          inputmode="numeric"
        />
        <label for="dob">Date of Birth <span>*</span></label>
        <input type="date" id="dob" name="dob" />
        <label class="section-label">Confirm Age</label>
        <div class="age-input form-section">
          <label for="age">Are you 18 years old?</label>
          <input type="checkbox" id="age" name="age" />
        </div>
        <label class="section-label">Select Gender <span>*</span></label>
        <div class="gender-options form-section">
          <label>
            <input type="radio" name="gender" id="male" value="male" />
            Male
          </label>
          <label>
            <input type="radio" name="gender" id="female" value="female" />
            Female
          </label>
          <label>
            <input type="radio" name="gender" id="others" value="other" />
            Others
          </label>
        </div>
        <label for="country">Select country <span>*</span></label>
        <div class="select-wrap">
          <select name="country" id="country">
            <option value="">Country</option>
            <option value="IN">INDIA</option>
          </select>
        </div>
        <label for="state">Select State <span>*</span></label>
        <div class="select-wrap">
          <select name="state" id="state">
            <option value="">State</option>
            <option value="UP">Uttar Pradesh</option>
            <option value="MH">Maharashtra</option>
            <option value="RJ">Rajasthan</option>
            <option value="GJ">Gujarat</option>
            <option value="WB">West Bengal</option>
            <option value="KA">Karnataka</option>
            <option value="TN">Tamil Nadu</option>
            <option value="KL">Kerala</option>
            <option value="MP">Madhya Pradesh</option>
            <option value="BR">Bihar</option>
          </select>
        </div>
        <label for="city">Select City <span>*</span></label>
        <div class="select-wrap">
          <select name="city" id="city">
            <option value="">City</option>
          </select>
        </div>
        <label for="address">Enter Address: <span>*</span></label>
        <textarea
          name="address"
          id="address"
          rows="2"
          placeholder="Enter Address"
        ></textarea>
        <br />
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </form>
      <br />
      <h3>Users List</h3>
      <table id="userTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Aadhaar</th>
            <th>Phone</th>
            <th>Age</th>
            <th>DOB</th>
            <th>Gender</th>
            <th>Country</th>
            <th>State</th>
            <th>City</th>
            <th>Address</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
